openapi: 3.0.3
info:
  title: Movie Discovery API
  version: 1.0.0
  description: An AI-powered movie discovery REST API built with Django, PostgreSQL
    and NLP. Features include JWT authentication, movie search, reviews, watchlists,
    semantic search and personalized recommendations.
paths:
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/auth/profile/:
    get:
      operationId: auth_profile_retrieve
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
          description: ''
  /api/auth/register/:
    post:
      operationId: auth_register_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/movies/:
    get:
      operationId: list_movies
      tags:
      - movies
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    post:
      operationId: create_movie
      tags:
      - movies
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Movie'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Movie'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Movie'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movie'
          description: ''
  /api/movies/{movie_id}/recommendations/:
    get:
      operationId: movie_recommendations
      summary: Get similar movie recommendations
      parameters:
      - in: path
        name: movie_id
        schema:
          type: integer
        required: true
      tags:
      - movies
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieRecommendationResponse'
          description: ''
  /api/movies/{movie_id}/reviews/:
    get:
      operationId: movies_reviews_list
      parameters:
      - in: path
        name: movie_id
        schema:
          type: integer
        required: true
      tags:
      - movies
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Review'
          description: ''
    post:
      operationId: movies_reviews_create
      parameters:
      - in: path
        name: movie_id
        schema:
          type: integer
        required: true
      tags:
      - movies
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Review'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Review'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Review'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
          description: ''
  /api/movies/{id}/:
    get:
      operationId: retrieve_movie
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - movies
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movie'
          description: ''
    put:
      operationId: update_movie
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - movies
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Movie'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Movie'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Movie'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movie'
          description: ''
    patch:
      operationId: partial_update_movie
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - movies
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMovie'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMovie'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMovie'
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movie'
          description: ''
    delete:
      operationId: delete_movie
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - movies
      security:
      - jwtAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/movies/for-you/:
    get:
      operationId: movies_for_you_retrieve
      tags:
      - movies
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/movies/mood/:
    get:
      operationId: mood_recommendations
      summary: Get movie recommendations by mood
      tags:
      - movies
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoodRecommendationResponse'
          description: ''
  /api/movies/nlp-search/:
    get:
      operationId: movies_nlp_search_retrieve
      tags:
      - movies
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/movies/semantic-search/:
    get:
      operationId: movies_semantic_search_retrieve
      tags:
      - movies
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/reviews/{review_id}/:
    patch:
      operationId: reviews_partial_update
      parameters:
      - in: path
        name: review_id
        schema:
          type: integer
        required: true
      tags:
      - reviews
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedReview'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedReview'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedReview'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
          description: ''
    delete:
      operationId: reviews_destroy
      parameters:
      - in: path
        name: review_id
        schema:
          type: integer
        required: true
      tags:
      - reviews
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/watched/:
    get:
      operationId: watched_list
      tags:
      - watched
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WatchedMovie'
          description: ''
    post:
      operationId: watched_create
      tags:
      - watched
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchedMovie'
          description: ''
  /api/watched/{movie_id}/:
    delete:
      operationId: watched_destroy
      parameters:
      - in: path
        name: movie_id
        schema:
          type: integer
        required: true
      tags:
      - watched
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/watchlist/:
    get:
      operationId: watchlist_list
      tags:
      - watchlist
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Watchlist'
          description: ''
    post:
      operationId: watchlist_create
      tags:
      - watchlist
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Watchlist'
          description: ''
  /api/watchlist/{movie_id}/:
    delete:
      operationId: watchlist_destroy
      parameters:
      - in: path
        name: movie_id
        schema:
          type: integer
        required: true
      tags:
      - watchlist
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/welcome/:
    get:
      operationId: api_welcome
      tags:
      - welcome
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
components:
  schemas:
    MoodRecommendationResponse:
      type: object
      properties:
        mood:
          type: string
        count:
          type: integer
        recommendations:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - count
      - mood
      - recommendations
    Movie:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        genres:
          type: array
          items:
            type: integer
            writeOnly: true
          writeOnly: true
        genre_names:
          type: array
          items:
            type: string
          readOnly: true
        actor_names:
          type: array
          items:
            type: string
          readOnly: true
        director_names:
          type: string
          readOnly: true
        title:
          type: string
          maxLength: 255
        overview:
          type: string
        release_date:
          type: string
          format: date
          nullable: true
        runtime:
          type: integer
          maximum: 2147483647
          minimum: 0
        original_language:
          type: string
          maxLength: 50
        poster_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        backdrop_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        tmdb_id:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        rating:
          type: number
          format: double
        vote_count:
          type: integer
          maximum: 2147483647
          minimum: 0
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        director:
          type: integer
          nullable: true
        actors:
          type: array
          items:
            type: integer
      required:
      - actor_names
      - created_at
      - director_names
      - genre_names
      - genres
      - id
      - original_language
      - overview
      - runtime
      - title
      - updated_at
    MovieRecommendationResponse:
      type: object
      properties:
        movie:
          type: string
        count:
          type: integer
        recommendations:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - count
      - movie
      - recommendations
    PatchedMovie:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        genres:
          type: array
          items:
            type: integer
            writeOnly: true
          writeOnly: true
        genre_names:
          type: array
          items:
            type: string
          readOnly: true
        actor_names:
          type: array
          items:
            type: string
          readOnly: true
        director_names:
          type: string
          readOnly: true
        title:
          type: string
          maxLength: 255
        overview:
          type: string
        release_date:
          type: string
          format: date
          nullable: true
        runtime:
          type: integer
          maximum: 2147483647
          minimum: 0
        original_language:
          type: string
          maxLength: 50
        poster_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        backdrop_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        tmdb_id:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        rating:
          type: number
          format: double
        vote_count:
          type: integer
          maximum: 2147483647
          minimum: 0
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        director:
          type: integer
          nullable: true
        actors:
          type: array
          items:
            type: integer
    PatchedReview:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        movie:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        rating:
          type: integer
          maximum: 32767
          minimum: 0
        comment:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    Register:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        password:
          type: string
          writeOnly: true
        password2:
          type: string
          writeOnly: true
      required:
      - email
      - id
      - password
      - password2
      - username
    Review:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        movie:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        rating:
          type: integer
          maximum: 32767
          minimum: 0
        comment:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - movie
      - rating
      - updated_at
      - username
    TokenObtainPair:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - password
      - refresh
      - username
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
    UserProfileResponse:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
          format: email
      required:
      - email
      - id
      - username
    WatchedMovie:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        movie:
          allOf:
          - $ref: '#/components/schemas/Movie'
          readOnly: true
        watched_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - movie
      - watched_at
    Watchlist:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        movie:
          allOf:
          - $ref: '#/components/schemas/Movie'
          readOnly: true
        added_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - added_at
      - id
      - movie
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
